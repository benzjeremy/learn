name: Android Package Pipeline

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Fastlane Metadata Structure
        run: |
          test -f fastlane/metadata/android/de-DE/title.txt
          test -f fastlane/metadata/android/de-DE/short_description.txt
          test -f fastlane/metadata/android/de-DE/full_description.txt
          test -f fastlane/metadata/android/en-US/title.txt
          test -f fastlane/metadata/android/en-US/short_description.txt
          test -f fastlane/metadata/android/en-US/full_description.txt
          test -f fastlane/metadata/android/images/icon.png
          echo "Fastlane metadata structure for F-Droid and IzzyOnDroid is verified."
